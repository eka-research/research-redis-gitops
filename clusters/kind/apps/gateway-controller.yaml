apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: eka
  source:
    repoURL: https://github.com/eka-research/research-redis-gitops.git
    targetRevision: main
    path: platform/gateway/controller
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
