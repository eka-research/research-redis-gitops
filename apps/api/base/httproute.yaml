apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: eka
      namespace: eka-gateway
      sectionName: http
  hostnames:
    - api.localtest.me
  rules:
    # /metrics stays internal: it's scraped in-cluster, never through the Gateway.
    - matches:
        - path: { type: PathPrefix, value: /metrics }
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: { type: ReplaceFullPath, replaceFullPath: /healthz }
            statusCode: 302
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: api
          port: 8080
