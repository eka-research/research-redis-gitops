apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
spec:
  serviceName: elasticsearch-headless
  replicas: 1
  selector:
    matchLabels: {}
  template:
    metadata:
      labels: {}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Host prerequisite: vm.max_map_count >= 262144. kind nodes share the host
      # kernel, so set it in /etc/sysctl.d on the host; a pod can't set it.
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
          envFrom:
            - configMapRef:
                name: elasticsearch-env
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-auth
                  key: elastic-password
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          # Unauthenticated HTTP returns 401, so these are TCP probes. The real
          # cluster-health check happens in the migrate Job and the API /readyz.
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: transport }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 1536Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
