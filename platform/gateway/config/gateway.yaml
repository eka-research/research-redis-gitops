apiVersion: v1
kind: Namespace
metadata:
  name: eka-gateway
  labels:
    app.kubernetes.io/part-of: research-redis
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eka
  namespace: eka-gateway
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.localtest.me"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.eka-research.io/attach: "true"
