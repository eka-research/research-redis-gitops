apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: eka-data
labels:
  - pairs:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: research-redis
    includeSelectors: true
resources:
  - statefulset.yaml
  - service.yaml
configMapGenerator:
  - name: redis-config
    files:
      - redis.conf
