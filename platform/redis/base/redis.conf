# Standalone Redis: cache only, so losing data is acceptable (the API falls
# back to MySQL). AOF stays on so the cache comes back warm after a restart.
bind 0.0.0.0
protected-mode yes
port 6379
dir /data
appendonly yes
appendfsync everysec
maxmemory 128mb
maxmemory-policy allkeys-lru
# Disable footguns for app users.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
