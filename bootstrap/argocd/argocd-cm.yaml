apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Local kind clusters do not receive inbound GitHub webhooks; poll every 60s.
  timeout.reconciliation: 60s
  # App-of-apps sync waves only wait on child Application health if
  # Application health assessment is restored (removed by default in ArgoCD 1.8+).
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
  # Enable Kustomize helmCharts inflation.
  kustomize.buildOptions: --enable-helm
